[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "redag"
version = "2.0.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.8,<3",
    "numpy>=2.0,<3",
    "pillow>=11,<14",
]

[project.optional-dependencies]
models = [
    "transformers>=5.12.1,<6",
    "diffusers>=0.38.0,<0.39",
    "peft>=0.20.0,<0.21",
    "accelerate>=1.14.0,<2",
    "safetensors>=0.5",
    "sentencepiece>=0.2",
    "torchvision>=0.23",
    "bitsandbytes>=0.46; sys_platform == 'linux'",
]
test = ["pytest>=8,<10", "ruff>=0.11"]

[tool.hatch.build.targets.wheel]
packages = ["redag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
ignore = ["E402"]
