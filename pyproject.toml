[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-image"
version = "0.1.0"
description = "Multimodal DAG planning and joint image policy learning"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.1,<3",
  "pillow>=11,<14",
  "pydantic>=2.10,<3",
  "pyyaml>=6,<7",
  "scipy>=1.14,<2",
  "safetensors>=0.5",
  "huggingface-hub>=0.34",
  "httpx>=0.28,<1",
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "datasets>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11"]

[project.scripts]
agentic-image = "agentic_image.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_image"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
